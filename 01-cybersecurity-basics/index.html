
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Basics Simulation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #2563eb;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #feedback {
            margin-top: 20px;
            font-weight: bold;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 30px;
        }

        .navigation a {
            background: #16a34a;
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 6px;
            flex: 1;
        }

        .navigation a:first-child {
            background: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛡️ Cybersecurity Basics</h1>

    <p>Welcome to your first cybersecurity challenge!</p>

    <h3>
        You find a computer in a public place that someone has left unlocked.
        What should you do?
    </h3>

    <button onclick="checkAnswer(0)">
        Use the computer without permission
    </button>

    <button onclick="checkAnswer(1)">
        Lock the computer and inform the owner or staff
    </button>

    <button onclick="checkAnswer(2)">
        Look through the person's files
    </button>

    <p id="feedback"></p>

    <button onclick="resetSimulation()">Try Again</button>

    <div class="navigation">
        <a href="../index.html">
            🏠 Home
        </a>

        <a href="../02-phishing/index.html">
            Next Module →
        </a>
    </div>

</div>

<script>
    function checkAnswer(choice) {
        const feedback = document.getElementById("feedback");

        if (choice === 1) {
            feedback.textContent =
                "Correct! Protecting other people's devices and information is an important part of cybersecurity.";

            feedback.style.color = "green";
        } else {
            feedback.textContent =
                "Not quite! You should never access another person's computer or files without permission.";

            feedback.style.color = "red";
        }
    }

    function resetSimulation() {
        document.getElementById("feedback").textContent = "";
    }
</script>

</body>
</html>
