
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Safety Simulation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #2563eb;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #feedback {
            margin-top: 20px;
            font-weight: bold;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 30px;
        }

        .navigation a {
            background: #2563eb;
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 6px;
            flex: 1;
        }

        .navigation a:last-child {
            background: #16a34a;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛡️ Online Safety Challenge</h1>

    <p>Test your knowledge of staying safe online!</p>

    <h3 id="question"></h3>

    <div id="options"></div>

    <p id="feedback"></p>

    <button id="nextButton" onclick="nextQuestion()">
        Next Question
    </button>

    <div class="navigation">
        <a href="../07-linux-basics/">← Previous Module</a>
        <a href="../index.html">🏠 Home</a>
    </div>

</div>

<script>
    const questions = [
        {
            question: "You receive an email asking you to click a suspicious link. What should you do?",
            options: [
                "Click the link",
                "Ignore it and report the email",
                "Send your password"
            ],
            answer: 1,
            explanation: "Correct! Avoid suspicious links and report the message."
        },
        {
            question: "What should you do before connecting to public Wi-Fi?",
            options: [
                "Connect to any available network",
                "Share your password",
                "Confirm the correct network with staff"
            ],
            answer: 2,
            explanation: "Correct! Confirm the network name before connecting."
        },
        {
            question: "How can you protect your online accounts?",
            options: [
                "Use strong passwords and two-factor authentication",
                "Use the same password everywhere",
                "Share passwords with friends"
            ],
            answer: 0,
            explanation: "Correct! Strong passwords and 2FA improve account security."
        },
        {
            question: "What should you check before entering information on a website?",
            options: [
                "Whether it looks colorful",
                "Whether the website address is legitimate",
                "Whether it has many advertisements"
            ],
            answer: 1,
            explanation: "Correct! Check the website address carefully."
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;

        const question = questions[currentQuestion];

        document.getElementById("question").textContent =
            question.question;

        document.getElementById("feedback").textContent = "";

        const options = document.getElementById("options");
        options.innerHTML = "";

        question.options.forEach((option, index) => {
            const button = document.createElement("button");

            button.textContent = option;
            button.onclick = () => checkAnswer(index);

            options.appendChild(button);
        });

        document.getElementById("nextButton").style.display = "block";
        document.getElementById("nextButton").textContent =
            currentQuestion === questions.length - 1
            ? "Finish Challenge"
            : "Next Question";
    }

    function checkAnswer(choice) {
        if (answered) return;

        answered = true;

        const feedback = document.getElementById("feedback");

        if (choice === questions[currentQuestion].answer) {
            score++;
            feedback.textContent =
                questions[currentQuestion].explanation;
            feedback.style.color = "green";
        } else {
            feedback.textContent =
                "Not quite! " + questions[currentQuestion].explanation;
            feedback.style.color = "red";
        }

        document.querySelectorAll("#options button").forEach(button => {
            button.disabled = true;
        });
    }

    function nextQuestion() {
        if (!answered) {
            document.getElementById("feedback").textContent =
                "Please choose an answer first.";
            document.getElementById("feedback").style.color = "red";
            return;
        }

        currentQuestion++;

        if (currentQuestion >= questions.length) {
            document.getElementById("question").textContent =
                "🎉 Congratulations! You completed all 8 modules!";

            document.getElementById("options").innerHTML = "";

            document.getElementById("feedback").textContent =
                "Your score: " + score + " out of " +
                questions.length + ". Keep practising safe online habits!";

            document.getElementById("feedback").style.color = "green";

            document.getElementById("nextButton").textContent =
                "Try Again";

            document.getElementById("nextButton").onclick = restartQuiz;

            return;
        }

        loadQuestion();
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;

        document.getElementById("nextButton").onclick = nextQuestion;

        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
